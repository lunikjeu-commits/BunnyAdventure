name: Android build

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Type de compilation"
        type: choice
        options:
          - debug
          - release
        default: debug

env:
  GODOT_VERSION: "4.3"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Installer Godot et les templates d'export
        run: |
          set -e
          V="${GODOT_VERSION}-stable"
          wget -q "https://github.com/godotengine/godot/releases/download/${V}/Godot_v${V}_linux.x86_64.zip"
          unzip -q "Godot_v${V}_linux.x86_64.zip"
          sudo mv "Godot_v${V}_linux.x86_64" /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot
          wget -q "https://github.com/godotengine/godot/releases/download/${V}/Godot_v${V}_export_templates.tpz"
          unzip -q "Godot_v${V}_export_templates.tpz" -d tpl
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mv tpl/templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/
          rm -rf tpl *.zip *.tpz
          godot --version

      - name: Installer le SDK Android
        run: |
          set -e
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "ANDROID_SDK=$SDK" >> "$GITHUB_ENV"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "build-tools;34.0.0" "platforms;android-34" "cmdline-tools;latest"

      - name: Configurer Godot pour Android
        run: |
          set -e
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-${GODOT_VERSION}.tres <<EOT
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "${ANDROID_SDK}"
          export/android/java_sdk_path = "${JAVA_HOME}"
          EOT
          # Clé de debug générée à la volée (jamais stockée dans le dépôt)
          keytool -genkey -v -keystore "$RUNNER_TEMP/debug.keystore" -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$RUNNER_TEMP/debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"

      - name: Importer les ressources
        run: |
          godot --headless --path . --import 2>&1 | tee import.log || true
          if grep -E "SCRIPT ERROR|Parse Error" import.log; then
            echo "::error::Erreurs détectées à l'import"; exit 1
          fi

      - name: Vérifier les scripts
        run: |
          set -e
          for f in scripts/*.gd; do
            echo "Vérification de $f"
            godot --headless --path . --check-only --script "res://$f"
          done

      - name: Compiler l'APK (debug)
        if: github.event_name != 'workflow_dispatch' || inputs.build_type == 'debug'
        run: |
          mkdir -p build
          godot --headless --path . --export-debug "Android Debug" build/BunnyAdventure.apk
          echo "APK_PATH=build/BunnyAdventure.apk" >> "$GITHUB_ENV"

      - name: Compiler l'APK (release signé)
        if: github.event_name == 'workflow_dispatch' && inputs.build_type == 'release'
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_USER: ${{ secrets.ANDROID_KEYSTORE_USER }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -e
          if [ -z "$KS_B64" ] || [ -z "$KS_USER" ] || [ -z "$KS_PASS" ]; then
            echo "::error::Secrets manquants : ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_USER, ANDROID_KEYSTORE_PASSWORD"; exit 1
          fi
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          export GODOT_ANDROID_KEYSTORE_RELEASE_PATH="$RUNNER_TEMP/release.keystore"
          export GODOT_ANDROID_KEYSTORE_RELEASE_USER="$KS_USER"
          export GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD="$KS_PASS"
          mkdir -p build
          godot --headless --path . --export-release "Android Release" build/BunnyAdventure-release.apk
          rm -f "$RUNNER_TEMP/release.keystore"
          echo "APK_PATH=build/BunnyAdventure-release.apk" >> "$GITHUB_ENV"

      - name: Vérifier l'APK
        run: |
          set -e
          test -f "$APK_PATH" || { echo "::error::APK introuvable"; exit 1; }
          SIZE=$(stat -c%s "$APK_PATH")
          echo "Taille : $SIZE octets"
          [ "$SIZE" -gt 5000000 ] || { echo "::error::APK trop petit"; exit 1; }
          unzip -tq "$APK_PATH"
          unzip -l "$APK_PATH" | grep -q AndroidManifest.xml
          "$ANDROID_SDK/build-tools/34.0.0/apksigner" verify --verbose "$APK_PATH"

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: BunnyAdventure-apk
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
